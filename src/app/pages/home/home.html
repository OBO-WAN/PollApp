<div class="home-page">
  <header class="site-header">
    <a class="logo" href="/" aria-label="Poll App home">
      <span class="logo__mark" aria-hidden="true">
        <img src="/assets/images/logo-mark.svg" alt="" />

        <span class="logo__details">
          <span class="logo__detail-row">
            <span class="logo__checkbox"></span>
            <span class="logo__line"></span>
          </span>

          <span class="logo__detail-row">
            <span class="logo__checkbox"></span>
            <span class="logo__line"></span>
          </span>
        </span>
      </span>

      <span class="logo__name">
        <span>Poll</span>
        <span>App</span>
      </span>
    </a>
  </header>

  <main class="home-content">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero__copy">
        <div class="hero__text">
          <h1 id="hero-title">
            Collect Feedback,<br />
            Unlock Ideas
          </h1>

          <p>
            Create and share surveys in minutes – from team events to workplace culture. Collect
            opinions, engage your audience, and turn feedback into action.
          </p>
        </div>

        <button class="primary-button" type="button">New survey</button>
      </div>

      <div class="hero__visual" aria-hidden="true">
        <img class="hero__image" src="/assets/images/home-hero.png" alt="" />

        <img
          class="hero__accent hero__accent--one"
          src="/assets/images/home-hero-accent-one.svg"
          alt=""
        />

        <img
          class="hero__accent hero__accent--two"
          src="/assets/images/home-hero-accent-two.svg"
          alt=""
        />
      </div>
    </section>
  </main>
</div>
